[project]
seed = 20260813
threads = 8
mode = "offline"
artifacts_dir = "artifacts/runs"
cache_dir = "artifacts/cache"

[data]
env_var = "P1_DATA_DIR"
train_file = "train.csv"
test_file = "test.csv"
sample_file = "sample_submission.csv"
baseline_file = "baseline_rule.csv"

[features]
windows_hours = [3, 6, 12, 24, 48, 72, 168]
plateau_epsilon = 0.000001
depth_regime_tolerance_m = 2.0
include_peer = true

[validation]
purge_days = 7
folds = [
  { name = "2025_q2", train_end = "2025-03-24T23:50:00+09:00", val_start = "2025-04-01T00:00:00+09:00", val_end = "2025-07-01T00:00:00+09:00" },
  { name = "2025_q3", train_end = "2025-06-23T23:50:00+09:00", val_start = "2025-07-01T00:00:00+09:00", val_end = "2025-10-01T00:00:00+09:00" },
  { name = "2025_q4", train_end = "2025-09-23T23:50:00+09:00", val_start = "2025-10-01T00:00:00+09:00", val_end = "2025-12-11T00:00:00+09:00" },
]
calibration_days = 60

[models.lightgbm]
n_estimators = 900
learning_rate = 0.035
num_leaves = 31
max_depth = -1
min_child_samples = 100
subsample = 0.85
colsample_bytree = 0.85
reg_alpha = 0.2
reg_lambda = 1.0

[models.xgboost]
n_estimators = 700
learning_rate = 0.04
max_depth = 7
min_child_weight = 20.0
subsample = 0.85
colsample_bytree = 0.85

[models.catboost]
iterations = 700
learning_rate = 0.04
depth = 8

[postprocess]
plateau_min_length = 6
threshold_grid = [0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7]
low_ratio_grid = [0.5, 0.7, 0.85]
gap_grid = [0, 1, 2, 3, 6]
continuous_min_grid = [1, 3, 6, 12]

[deep]
window_steps = 2016
patch_steps = 6
max_epochs = 50
patience = 8
batch_size = 16
seeds = [20260813, 20260814, 20260815]
use_bfloat16 = true

[external]
enabled = false
max_time_kst = "2023-12-31T23:59:59+09:00"
allowed_station = "I-ORS"
allowed_doi = "10.22808/DATA-2024-6"
